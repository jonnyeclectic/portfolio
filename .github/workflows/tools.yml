name: tools

# The Python suite. Two things live in it, and they need different triggers.
#
# tools/ is what visual.yml does not reach — its path filters are all HTML, CSS
# and the visual harness, so every commit touching only tools/ or
# tests/test_*.py would otherwise land with nothing run against it.
#
# test_site_positioning.py and test_site_claims.py run the other way round:
# they read the live pages, so they have to fire on HTML edits too. That is why
# "**.html" is in the filter below even though this workflow is nominally about
# tools/. Without it the guards would sit green while the exact edits they
# exist to catch sailed past, because visual.yml renders pages but never runs
# Python. The suite is stdlib-only and finishes in well under a second, so the
# extra triggers are close to free.
#
# "images/**" is here because test_site_claims.py now reads the resume PDF.
# That file is the highest-distribution artifact in the repo — it is what gets
# forwarded to recruiters and parsed by ATS software — and until it acquired a
# test it was also the least governed: no workflow watched it, so a regenerated
# resume could contradict every page on the site and CI would stay green.
#
# The test glob is "tests/**.py", not "tests/test_*.py": pdftext.py is a helper
# rather than a test module, so the narrower pattern would let a change to the
# PDF decoder itself land untested.
#
# tools/reddit_query.py is a network client whose every real bug was in the
# transport layer (silent gzip truncation, IncompleteRead, double-unescaped
# entities). The suite is the record of those bugs, so it needs to run on its
# own without being remembered.
#
# No setup-python step and no dependency install: the suite is stdlib-only and
# fully offline, faking urlopen rather than reaching the network, so the
# runner's preinstalled python3 is the whole toolchain. Anything >= 3.9 works
# (str.removeprefix is the floor).

on:
  push:
    branches: [master]
    paths:
      - "tools/**"
      - "tests/**.py"
      - "**.html"
      - "images/**"
      - ".github/workflows/tools.yml"
  pull_request:
    paths:
      - "tools/**"
      - "tests/**.py"
      - "**.html"
      - "images/**"
      - ".github/workflows/tools.yml"

permissions: {}

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: harden runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: record the interpreter
        # Printed so a version-specific failure is diagnosable from the log
        # alone, rather than needing a rerun to find out what ran.
        run: python3 -VV
      - name: unit tests
        # -W error::ResourceWarning turns a leaked socket or file handle into a
        # failure. For a suite that fakes a network client, an unclosed response
        # is exactly the kind of bug worth catching here.
        run: python3 -W error::ResourceWarning -m unittest discover -s tests -p 'test_*.py' -v
